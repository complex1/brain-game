<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Concentration — Mental Game</title>
    <meta name="description" content="Flip cards and find every matching pair." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>
      <header class="game__header">
        <p class="label">// Memory</p>
        <h1>Concentration</h1>
        <p class="game__lead">Turn two cards at a time. Matching pairs stay open. Clear the board in as little time as you can.</p>
      </header>
      <dl class="hud">
        <div><dt class="label">Moves</dt><dd id="moves">0</dd></div>
        <div><dt class="label">Pairs</dt><dd id="pairs">0/8</dd></div>
        <div><dt class="label">Time</dt><dd id="time">0:00</dd></div>
        <div><dt class="label">Best</dt><dd id="best">—</dd></div>
      </dl>
      <section class="game__stage card">
        <p class="status" id="status" role="status">Press Start. Next board: 8 pairs.</p>
        <div class="grid" id="grid" role="group" aria-label="Cards"></div>
        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Board clear</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
