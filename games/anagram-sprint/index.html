<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anagram Sprint — Mental Game</title>
    <meta name="description" content="Unscramble short words before the clock runs out." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>
      <header class="game__header">
        <p class="label">// Language</p>
        <h1>Anagram Sprint</h1>
        <p class="game__lead">Tap the scrambled letters into a real word. A wrong guess clears, and you can try the same word again.</p>
      </header>
      <dl class="hud">
        <div><dt class="label">Time</dt><dd id="time">1:00</dd></div>
        <div><dt class="label">Score</dt><dd id="score">0</dd></div>
        <div><dt class="label">Streak</dt><dd id="streak">0</dd></div>
        <div><dt class="label">Best</dt><dd id="best">0</dd></div>
      </dl>
      <section class="game__stage card">
        <p class="status" id="status" role="status">Press Start. Unscramble as many words as you can.</p>
        <div class="answer" id="answer" aria-label="Your word"></div>
        <div class="tiles" id="tiles" aria-label="Scrambled letters"></div>
        <div class="game__actions">
          <button class="btn btn--ghost" type="button" id="clear-btn" hidden>Clear</button>
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Time's up</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
