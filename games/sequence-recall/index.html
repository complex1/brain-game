<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sequence Recall — Mental Game</title>
    <meta
      name="description"
      content="Watch a growing sequence of signals and repeat it in order."
    />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Memory</p>
        <h1>Sequence Recall</h1>
        <p class="game__lead">
          Watch the signals, then repeat them in the same order. Each round adds one. One mistake ends the run.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label">Round</dt>
          <dd id="round">—</dd>
        </div>
        <div>
          <dt class="label">Step</dt>
          <dd id="step">—</dd>
        </div>
        <div>
          <dt class="label">Best</dt>
          <dd id="best">0</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start. Repeat every signal in order.</p>

        <div class="pads" id="pads" role="group" aria-label="Signals">
          <button class="pad" type="button" data-tone="cyan" disabled>
            Cyan
            <kbd class="kbd">Q</kbd>
          </button>
          <button class="pad" type="button" data-tone="yellow" disabled>
            Yellow
            <kbd class="kbd">W</kbd>
          </button>
          <button class="pad" type="button" data-tone="green" disabled>
            Green
            <kbd class="kbd">A</kbd>
          </button>
          <button class="pad" type="button" data-tone="red" disabled>
            Red
            <kbd class="kbd">S</kbd>
          </button>
        </div>

        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>

        <div class="summary" id="summary" hidden>
          <h2>Sequence missed</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
