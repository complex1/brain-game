<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Missing Operator — Mental Game</title>
    <meta name="description" content="Choose the operation that makes the equation true." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>
      <header class="game__header">
        <p class="label">// Arithmetic</p>
        <h1>Missing Operator</h1>
        <p class="game__lead">One blank stands between two numbers. Pick the operation that reaches the result. Only one choice works.</p>
      </header>
      <dl class="hud">
        <div><dt class="label">Time</dt><dd id="time">1:00</dd></div>
        <div><dt class="label">Score</dt><dd id="score">0</dd></div>
        <div><dt class="label">Streak</dt><dd id="streak">0</dd></div>
        <div><dt class="label">Best</dt><dd id="best">0</dd></div>
      </dl>
      <section class="game__stage card">
        <p class="status" id="status" role="status">Press Start. Next round: easy, 60s.</p>
        <p class="equation" id="equation">7 ? 3 = 21</p>
        <div class="ops" id="ops" role="group" aria-label="Operations">
          <button class="btn btn--ghost op" type="button" data-op="+" disabled>+</button>
          <button class="btn btn--ghost op" type="button" data-op="-" disabled>−</button>
          <button class="btn btn--ghost op" type="button" data-op="*" disabled>×</button>
          <button class="btn btn--ghost op" type="button" data-op="/" disabled>÷</button>
        </div>
        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Time's up</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
