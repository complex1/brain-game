<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Akari — Mental Game</title>
    <meta name="description" content="Place lamps so every white cell is lit, no lamp shines on another, and every number counts its lamps." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Logic</p>
        <h1>Akari</h1>
        <p class="game__lead">
          Place lamps on white cells. A lamp lights its row and column until a wall. Light every white cell, never let a lamp shine on another, and give each numbered wall exactly that many lamps beside it.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label">Lit</dt>
          <dd id="lit">0</dd>
        </div>
        <div>
          <dt class="label">Lamps</dt>
          <dd id="lamps">0</dd>
        </div>
        <div>
          <dt class="label">Time</dt>
          <dd id="time">0:00</dd>
        </div>
        <div>
          <dt class="label">Best</dt>
          <dd id="best">—</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start to build a board.</p>
        <div class="summary" id="summary" hidden>
          <h2>All lit</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
        <div class="grid-board" id="board" role="group" aria-label="Akari board" hidden></div>
        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
          <button class="btn btn--ghost" type="button" id="clear-btn" hidden>Clear</button>
        </div>
      </section>
    </main>
  </body>
</html>
