<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Corsi Blocks — Mental Game</title>
    <meta name="description" content="Blocks light up in a sequence. Tap them in the same order, or in reverse." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>
      <header class="game__header">
        <p class="label">// Memory</p>
        <h1>Corsi Blocks</h1>
        <p class="game__lead">Nine blocks light up one at a time. Watch the order, then tap the same blocks in the same order, or in reverse in backward mode. Each success adds one block; one mistake ends the run.</p>
      </header>
      <dl class="hud">
        <div><dt class="label">Length</dt><dd id="length">2</dd></div>
        <div><dt class="label">Span</dt><dd id="span">0</dd></div>
        <div><dt class="label">Best</dt><dd id="best">—</dd></div>
      </dl>
      <section class="game__stage card">
        <p class="status" id="status" role="status">Press Start.</p>
        <div class="board" id="board" role="group" aria-label="Blocks"></div>
        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Run over</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
