<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Futoshiki — Mental Game</title>
    <meta
      name="description"
      content="Fill the grid so each row and column uses every number once, and every sign between cells holds."
    />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="manifest" href="../../manifest.webmanifest" />
    <link rel="icon" href="../../assets/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="../../assets/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mental Game" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script src="../../assets/js/pwa.js" defer></script>
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Logic</p>
        <h1>Futoshiki</h1>
        <p class="game__lead">
          Fill every row and column with each number once. A sign between two cells must hold: its point always faces the smaller number.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label">Filled</dt>
          <dd id="filled">0</dd>
        </div>
        <div>
          <dt class="label">Time</dt>
          <dd id="time">0:00</dd>
        </div>
        <div>
          <dt class="label">Best</dt>
          <dd id="best">—</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start. Each row and column uses every number once.</p>

        <div class="summary" id="summary" hidden>
          <h2>Solved</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>

        <div class="board" id="board" role="group" aria-label="Futoshiki board"></div>

        <div class="pad" id="pad" hidden>
          <div class="pad__nums" id="pad-nums"></div>
          <button class="btn btn--ghost pad__clear" type="button" id="clear-btn">Clear</button>
        </div>

        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
      </section>
    </main>
  </body>
</html>
