<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Word Ladder — Mental Game</title>
    <meta name="description" content="Change one letter at a time until the start word becomes the goal." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>
      <header class="game__header">
        <p class="label">// Language</p>
        <h1>Word Ladder</h1>
        <p class="game__lead">Turn the start word into the goal. Each step changes one letter, and every step has to be a real word.</p>
      </header>
      <dl class="hud">
        <div><dt class="label">Steps</dt><dd id="steps">0</dd></div>
        <div><dt class="label">Time</dt><dd id="time">0:00</dd></div>
        <div><dt class="label">Best</dt><dd id="best">—</dd></div>
      </dl>
      <section class="game__stage card">
        <p class="status" id="status" role="status">Press Start. Next ladder: 3 letters.</p>
        <p class="goal" id="goal">Goal · —</p>
        <div class="word" id="word" aria-label="Current word"></div>
        <div class="alphabet" id="alphabet" hidden></div>
        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Ladder climbed</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
