<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Find the Number — Mental Game</title>
    <meta
      name="description"
      content="Three disks spin from one center. Pick the numbers in order, from 1 onward."
    />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Focus</p>
        <h1>Find the Number</h1>
        <p class="game__lead">
          Three disks share one center. The outer and inner spin clockwise, the middle spins the other way. Pick the numbers in order, from 1 onward.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label">Next</dt>
          <dd id="next">—</dd>
        </div>
        <div>
          <dt class="label">Found</dt>
          <dd id="found">0</dd>
        </div>
        <div>
          <dt class="label">Misses</dt>
          <dd id="misses">0</dd>
        </div>
        <div>
          <dt class="label">Time</dt>
          <dd id="time">0:00</dd>
        </div>
        <div>
          <dt class="label">Best</dt>
          <dd id="best">—</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start. Follow the numbers in order.</p>
        <div class="orbit" id="orbit">
          <div class="disk disk--outer" data-disk="outer"></div>
          <div class="disk disk--middle" data-disk="middle"></div>
          <div class="disk disk--inner" data-disk="inner"></div>
          <div class="hub" id="hub" aria-hidden="true">—</div>
        </div>

        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>

        <div class="summary" id="summary" hidden>
          <h2>Sequence complete</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
