<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hashi — Mental Game</title>
    <meta name="description" content="Connect every island with bridges that match its number, without crossings." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>
      <header class="game__header">
        <p class="label">// Logic</p>
        <h1>Hashi</h1>
        <p class="game__lead">
          Join the islands with straight bridges. The number is how many bridges touch that island. Bridges do not cross, and every island stays connected.
        </p>
      </header>
      <dl class="hud">
        <div><dt class="label">Linked</dt><dd id="linked">0</dd></div>
        <div><dt class="label">Time</dt><dd id="time">0:00</dd></div>
        <div><dt class="label">Best</dt><dd id="best">—</dd></div>
      </dl>
      <section class="game__stage card">
        <p class="status" id="status" role="status">Press Start. Connect every island.</p>
        <div class="sea" id="sea">
          <svg class="bridges" id="bridges" aria-hidden="true"></svg>
          <div class="islands" id="islands"></div>
        </div>
        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Islands linked</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
