<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zip — Mental Game</title>
    <meta
      name="description"
      content="Draw a path through every cell, hitting the numbers in order from start to finish."
    />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Logic</p>
        <h1>Zip</h1>
        <p class="game__lead">
          Draw one path through every cell. Hit the numbers in order, from 1 through to the end.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label">Next</dt>
          <dd id="next">—</dd>
        </div>
        <div>
          <dt class="label">Filled</dt>
          <dd id="filled">0</dd>
        </div>
        <div>
          <dt class="label">Time</dt>
          <dd id="time">0:00</dd>
        </div>
        <div>
          <dt class="label">Best</dt>
          <dd id="best">—</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start. Connect every cell in number order.</p>
        <div class="board" id="board">
          <div class="grid" id="grid" role="grid" aria-label="Zip board"></div>
          <svg class="trail" id="trail" aria-hidden="true">
            <polyline id="line"></polyline>
            <circle id="dot"></circle>
          </svg>
        </div>

        <div class="game__actions" id="tools" hidden>
          <button class="btn btn--ghost" type="button" id="undo-btn">Undo</button>
        </div>

        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>

        <div class="summary" id="summary" hidden>
          <h2>Connected</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
