<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Queens — Mental Game</title>
    <meta
      name="description"
      content="Place one queen in each row, column, and colored region so that no two queens touch."
    />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Logic</p>
        <h1>Queens</h1>
        <p class="game__lead">
          Place one queen in each row, column, and colored region. Queens cannot touch, even diagonally.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label">Queens</dt>
          <dd id="queens">0</dd>
        </div>
        <div>
          <dt class="label">Time</dt>
          <dd id="time">0:00</dd>
        </div>
        <div>
          <dt class="label">Best</dt>
          <dd id="best">—</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start. One queen per row, column, and color.</p>
        <div class="board" id="board" role="grid" aria-label="Queens board"></div>

        <div class="tools" id="tools" hidden>
          <button class="btn btn--ghost" type="button" id="queen-btn" aria-pressed="true">Queen</button>
          <button class="btn btn--ghost" type="button" id="mark-btn" aria-pressed="false">Mark</button>
          <button class="btn btn--ghost" type="button" id="clear-btn">Clear</button>
        </div>

        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>

        <div class="summary" id="summary" hidden>
          <h2>Solved</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
