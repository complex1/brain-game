<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hitori — Mental Game</title>
    <meta name="description" content="Shade cells so no number repeats in a row or column, shaded cells never touch, and the rest stays connected." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Logic</p>
        <h1>Hitori</h1>
        <p class="game__lead">
          Shade cells until no number repeats in any row or column. Shaded cells may not touch side by side, and the unshaded cells must stay one connected area.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label">Shaded</dt>
          <dd id="shaded">0</dd>
        </div>
        <div>
          <dt class="label">Time</dt>
          <dd id="time">0:00</dd>
        </div>
        <div>
          <dt class="label">Best</dt>
          <dd id="best">—</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start. Shade the repeats away.</p>
        <div class="grid" id="grid" role="group" aria-label="Hitori board"></div>
        <div class="game__actions">
          <button class="btn btn--ghost" type="button" id="clear-btn" hidden>Clear</button>
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Board solved</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
