<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Othello — Mental Game</title>
    <meta
      name="description"
      content="Play Othello (Reversi) against the computer. Trap discs to flip them, hold the corners, finish with the most discs."
    />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>

      <header class="game__header">
        <p class="label">// Strategy</p>
        <h1>Othello</h1>
        <p class="game__lead">
          Place a disc so it traps a line of the computer's discs between two of yours; the trapped discs flip to your color. With no move you pass. Most discs at the end wins.
        </p>
      </header>

      <dl class="hud">
        <div>
          <dt class="label" id="black-label">Black</dt>
          <dd id="black">2</dd>
        </div>
        <div>
          <dt class="label" id="white-label">White</dt>
          <dd id="white">2</dd>
        </div>
        <div>
          <dt class="label">Time</dt>
          <dd id="time">0:00</dd>
        </div>
        <div>
          <dt class="label">Best win</dt>
          <dd id="best">—</dd>
        </div>
      </dl>

      <section class="game__stage card" id="stage">
        <p class="status" id="status" role="status">Press Start.</p>

        <div class="summary" id="summary" hidden>
          <h2 id="summary-title">Game over</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>

        <div class="board is-idle" id="board" aria-label="Othello board"></div>

        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
          <button class="btn btn--ghost" type="button" id="undo-btn" hidden>Undo</button>
          <button class="btn btn--ghost" type="button" id="resign-btn" hidden>Resign</button>
        </div>
      </section>
    </main>
  </body>
</html>
