<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reverse Digits — Mental Game</title>
    <meta name="description" content="A number flashes. Type it backward." />
    <meta name="theme-color" content="#0a0c11" />
    <link rel="stylesheet" href="../../assets/css/tokens.css" />
    <link rel="stylesheet" href="../../assets/css/base.css" />
    <link rel="stylesheet" href="../../assets/css/components.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="../../assets/js/game-settings.js" defer></script>
    <script src="game.js" defer></script>
  </head>
  <body>
    <main class="container game">
      <div class="game__bar">
        <a class="btn btn--ghost" href="../../">← All games</a>
        <div data-game-settings></div>
      </div>
      <header class="game__header">
        <p class="label">// Memory</p>
        <h1>Reverse Digits</h1>
        <p class="game__lead">A number appears for a moment. After it disappears, enter those digits in reverse. Each success adds one digit.</p>
      </header>
      <dl class="hud">
        <div><dt class="label">Length</dt><dd id="length">3</dd></div>
        <div><dt class="label">Cleared</dt><dd id="cleared">0</dd></div>
        <div><dt class="label">Best</dt><dd id="best">—</dd></div>
      </dl>
      <section class="game__stage card">
        <p class="status" id="status" role="status">Press Start. Next run begins at 3 digits, normal speed.</p>
        <p class="prompt" id="prompt" aria-hidden="true"></p>
        <p class="entry" id="entry" aria-label="Reversed number"></p>
        <div class="pad" id="pad" hidden></div>
        <div class="game__actions">
          <button class="btn btn--primary" type="button" id="start-btn">Start</button>
        </div>
        <div class="summary" id="summary" hidden>
          <h2>Run over</h2>
          <p id="summary-text"></p>
          <button class="btn btn--primary" type="button" id="again-btn">Play again</button>
        </div>
      </section>
    </main>
  </body>
</html>
